# Dodil Git runs this on every push (.github is the workflow format, not GitHub).
# The image goes to THIS repo's org, so every remix builds into its own org.
name: ci
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not live'
      - run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: cd frontend && npm ci && npm run generate:types && git diff --exit-code src/api.generated.ts && npm run build
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
  build:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image name
        id: img
        # Image names must be lowercase; some org names are not (e.g. IHDIASH).
        run: |
          org="${DODIL_GIT_ORG:?}"; repo="${DODIL_GIT_REPO_NAME:?}"
          echo "ref=$DODIL_REGISTRY_URL/${org,,}/${repo,,}:$DODIL_GIT_SHA" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          DODIL_REGISTRY_URL: ${{ secrets.DODIL_REGISTRY_URL }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DODIL_REGISTRY_URL }}
          username: ci
          password: ${{ secrets.DODIL_REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: true
          tags: ${{ steps.img.outputs.ref }}
